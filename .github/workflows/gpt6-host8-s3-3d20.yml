name: GitRAM Host8 300GB synthetic plane and 3D S3 20-worker experiment
on:
  push:
    branches: [gpt6-host8-s3-3d20-20261111]
    paths:
      - '.github/workflows/gpt6-host8-s3-3d20.yml'
      - 'experiments/host8-s3-3d20/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitram-host8-3d20-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shard00:
    name: Native Host8 slice shard 00 / 19
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      record: ${{ steps.native.outputs.record }}
    steps:
      - name: Native Rust 1.81, Clippy, 3D S3, 8-byte Host8 rooms
        id: native
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.81.0 --profile minimal --component clippy
          git clone -q --depth 1 --filter=blob:none --no-checkout --single-branch --branch "gpt6-host8-s3-3d20-20261111" https://github.com/JesseBrown1980/GitRAM.git work
          git -C work sparse-checkout set experiments/host8-s3-3d20
          git -C work checkout -q "$GITHUB_SHA"
          test "$(git -C work rev-parse HEAD)" = "$GITHUB_SHA"
          cargo +1.81.0 clippy --manifest-path work/experiments/host8-s3-3d20/Cargo.toml --all-targets -- -D warnings
          cargo +1.81.0 test --manifest-path work/experiments/host8-s3-3d20/Cargo.toml
          cargo +1.81.0 build --release --manifest-path work/experiments/host8-s3-3d20/Cargo.toml
          record="$(work/experiments/host8-s3-3d20/target/release/host8-s3-3d20 shard 0)"
          printf '%s\n' "$record" | grep -Fq 'HOST8_SHARD|id=0|'
          printf '%s\n' "$record"
          printf 'record=%s\n' "$record" >> "$GITHUB_OUTPUT"

